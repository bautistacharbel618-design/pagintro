<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la Serpiente</title>
    <h2><a href="index.html">REGRESAR</a></h2>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background-color: #34495e;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            border: 3px solid #ecf0f1;
            border-radius: 5px;
            max-width: 95%; /* Para que se adapte a pantallas pequeñas */
            touch-action: none; /* Evita que la pantalla haga scroll al deslizar */
        }
        .ui-container {
            margin-top: 20px;
            text-align: center;
            height: 50px;
        }
        button {
            padding: 10px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            display: none; /* Oculto al iniciar */
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #c0392b;
        }
        #score-board {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="score-board">PUNTOS: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="ui-container">
        <button id="restartBtn" onclick="resetGame()">Jugar de Nuevo</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const restartBtn = document.getElementById("restartBtn");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let speed = 7;
        let isGameOver = false;

        function drawGame() {
            if(isGameOver) return;

            clearScreen();
            moveSnake();
            checkCollision();
            drawFood();
            drawSnake();
            
            if(!isGameOver) {
                setTimeout(drawGame, 1000 / speed);
            }
        }

        function clearScreen() {
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                // La cabeza es de un verde más claro
                ctx.fillStyle = i === 0 ? "#2ecc71" : "#27ae60"; 
                let part = snake[i];
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            }
        }

        function drawFood() {
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function moveSnake() {
            // Si la serpiente no se está moviendo, no hacer nada
            if (dx === 0 && dy === 0) return; 

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                speed += 0.3; // Aumentar ligeramente la velocidad al comer
                placeFood();
            } else {
                snake.pop();
            }
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // Verificar que la comida no aparezca sobre el cuerpo de la serpiente
            for(let i = 0; i < snake.length; i++) {
                if(snake[i].x === food.x && snake[i].y === food.y) {
                    placeFood();
                    break;
                }
            }
        }

        function checkCollision() {
            const head = snake[0];

            // Choque con las paredes
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
            }

            // Choque con su propio cuerpo
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                }
            }
        }

        function gameOver() {
            isGameOver = true;
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "white";
            ctx.font = "bold 40px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);
            
            restartBtn.style.display = "inline-block";
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            speed = 7;
            scoreElement.innerText = score;
            isGameOver = false;
            restartBtn.style.display = "none";
            placeFood();
            drawGame();
        }

        // Control con el Teclado
        window.addEventListener('keydown', e => {
            // Prevenir el scroll de la página con las flechas
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy === 0) { dx = 0; dy = -1; } 
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy === 0) { dx = 0; dy = 1; } 
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0) { dx = -1; dy = 0; } 
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0) { dx = 1; dy = 0; } 
                    break;
            }
        });

        // Controles táctiles para celulares (Swipe)
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        canvas.addEventListener('touchend', function(e) {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
        }, {passive: false});

        function handleSwipe(startX, startY, endX, endY) {
            let diffX = endX - startX;
            let diffY = endY - startY;
            
            // Solo registrar el swipe si el movimiento es lo suficientemente largo
            if(Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Movimiento Horizontal
                if (diffX > 0 && dx === 0) { dx = 1; dy = 0; } // Deslizamiento a la derecha
                else if (diffX < 0 && dx === 0) { dx = -1; dy = 0; } // Deslizamiento a la izquierda
            } else {
                // Movimiento Vertical
                if (diffY > 0 && dy === 0) { dx = 0; dy = 1; } // Deslizamiento hacia abajo
                else if (diffY < 0 && dy === 0) { dx = 0; dy = -1; } // Deslizamiento hacia arriba
            }
        }

        // Iniciar el juego
        placeFood();
        drawGame();
    </script>
</body>
</html>
